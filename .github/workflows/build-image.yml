# Builds a container image from this fork's existing docker/build.Dockerfile
# (via `make build-release build-docker`, the same pipeline used by
# build.yml's build-release job) and pushes it to GHCR on tag push.
'name': 'build-image'
'permissions': {}
'env':
  'GO_VERSION': '1.26.5'
  'NODE_VERSION': '20'
'on':
  'push':
    'tags':
      - 'v*'
'jobs':
  'build-and-push':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
      'packages': 'write'
    'steps':
      - 'name': 'Checkout'
        'uses': 'actions/checkout@v4'
        'with':
          'fetch-depth': 0
          'persist-credentials': false
      - 'name': 'Set up Go'
        'uses': 'actions/setup-go@v5'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'Set up Node'
        'uses': 'actions/setup-node@v4'
        'with':
          'node-version': '${{ env.NODE_VERSION }}'
      - 'name': 'Set up Go modules cache'
        'uses': 'actions/cache@v4'
        'with':
          'path': '~/go/pkg/mod'
          'key': "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"
          'restore-keys': '${{ runner.os }}-go-'
      - 'name': 'Set up QEMU'
        'uses': 'docker/setup-qemu-action@v3'
      - 'name': 'Set up Docker Buildx'
        'uses': 'docker/setup-buildx-action@v3'
        'with':
          'install': true
      - 'name': 'Log in to GHCR'
        'uses': 'docker/login-action@v3'
        'with':
          'registry': 'ghcr.io'
          'username': '${{ github.actor }}'
          'password': '${{ secrets.GITHUB_TOKEN }}'
      - 'name': 'Build and push image'
        # Reuses the existing release pipeline: build-release produces the
        # per-arch binaries under dist/, build-docker feeds them to
        # docker/build.Dockerfile via `docker buildx build --push`.
        #
        # VERSION must be set to something other than the Makefile's default
        # ('v0.0.0'), or build-release.sh falls back to
        # scripts/make/version.sh, whose 'development' channel path runs
        # `git rev-list --count master..HEAD` -- a ref actions/checkout never
        # creates on a tag-triggered run, so that fails outright.  Passing
        # the pushed tag name directly avoids that (this is the same
        # workaround build.yml's build-release job uses via
        # VERSION="v0.0.0-github").
        #
        # CHANNEL must be 'release' (not the Makefile default,
        # 'development'): scripts/make/build-docker.sh only emits any
        # --tag flags at all for 'release'/'beta'/'edge' channels; for
        # 'development' both the version and channel docker tags are left
        # empty, which would build an untagged image and make --push fail.
        # 'release' tags the image as both ":<tag>" and ":latest".
        'env':
          'CHANNEL': 'release'
          'DOCKER_IMAGE_NAME': 'ghcr.io/beechfuzz/adguardhome'
          'DOCKER_PUSH': '1'
          'VERSION': '${{ github.ref_name }}'
        'run': 'make SIGN=0 VERBOSE=1 CHANNEL="$CHANNEL" VERSION="$VERSION" build-release build-docker'
