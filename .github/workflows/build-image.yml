# DRAFT — not enabled.  Builds a container image from this fork's existing
# docker/build.Dockerfile (via `make build-release build-docker`, the same
# pipeline used by build.yml's build-release job) and pushes it to GHCR on
# tag push.  Left un-merged pending manual review; see the socket-activation
# PR description for context.
'name': 'build-image'
'permissions': {}
'env':
  'GO_VERSION': '1.26.5'
  'NODE_VERSION': '20'
'on':
  'push':
    'tags':
      - 'v*'
'jobs':
  'build-and-push':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
      'packages': 'write'
    'steps':
      - 'name': 'Checkout'
        'uses': 'actions/checkout@v4'
        'with':
          'fetch-depth': 0
          'persist-credentials': false
      - 'name': 'Set up Go'
        'uses': 'actions/setup-go@v5'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'Set up Node'
        'uses': 'actions/setup-node@v4'
        'with':
          'node-version': '${{ env.NODE_VERSION }}'
      - 'name': 'Set up Go modules cache'
        'uses': 'actions/cache@v4'
        'with':
          'path': '~/go/pkg/mod'
          'key': "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"
          'restore-keys': '${{ runner.os }}-go-'
      - 'name': 'Set up QEMU'
        'uses': 'docker/setup-qemu-action@v3'
      - 'name': 'Set up Docker Buildx'
        'uses': 'docker/setup-buildx-action@v3'
        'with':
          'install': true
      - 'name': 'Log in to GHCR'
        'uses': 'docker/login-action@v3'
        'with':
          'registry': 'ghcr.io'
          'username': '${{ github.actor }}'
          'password': '${{ secrets.GITHUB_TOKEN }}'
      - 'name': 'Build and push image'
        # Reuses the existing release pipeline: build-release produces the
        # per-arch binaries under dist/, build-docker feeds them to
        # docker/build.Dockerfile via `docker buildx build --push`.  Only
        # DOCKER_IMAGE_NAME/DOCKER_PUSH are new here; everything else is the
        # same as build.yml's build-release job.
        'env':
          'DOCKER_IMAGE_NAME': 'ghcr.io/beechfuzz/adguardhome'
          'DOCKER_PUSH': '1'
        'run': 'make SIGN=0 VERBOSE=1 build-release build-docker'
